# Publica uma versão: tudo que for enviado ao ramo "upload" vira uma Release
# (MultiHunt.exe + pacote de atualização + SHA256SUMS), e o ramo é apagado em seguida.
name: Publicar versão
on:
  push:
    branches: [upload]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upload
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER=$(cat VERSION | tr -d '[:space:]')
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION inválida: $VER"; exit 1; }
          cd files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "v$VER" * --repo "$GITHUB_REPOSITORY" --target main \
            --title "MultiHunt $VER" --notes-file ../NOTES.md --latest
      - name: Apagar ramo de envio
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/upload" || true
